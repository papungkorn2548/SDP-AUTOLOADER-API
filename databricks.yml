bundle:
  name: dabs_workshop

include:
  - resources/*.yml

variables:
  catalog:
  root_path:
    default: /Workspace/Users/<{YOUR-EMAIL}>/.bundle/${bundle.name}/${bundle.target}

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: <{YOUR-HOST}>
      root_path: ${var.root_path}
    variables:
      catalog: dev
    resources:
      jobs:
        SDP_API_AUTOLOADER:
          environments:
            - environment_key: default
              spec:
                environment_version: "4"

  prod:
    mode: production
    workspace:
      host: <{YOUR-HOST}>
      root_path: ${var.root_path}
    variables:
      catalog: prod
    resources:
      jobs:
        SDP_API_AUTOLOADER:
          environments:
            - environment_key: default
              spec:
                environment_version: "4"
