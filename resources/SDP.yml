resources:
  pipelines:
    SDP_PIPELINE:
      name: SDP-AUTOLOADER-Pipeline
      libraries:
        - file:
            path: ../src/src/Bronze_setup.py
        - file:
            path: ../src/src/Bronze_api_ingest.py
        - file:
            path: ../src/src/staging_weather.py
        - file:
            path: ../src/src/silver.py
        - file:
            path: ../src/src/Gold.py
  jobs:
    SDP_API_AUTOLOADER:
      name: SDP-API-AUTOLOADER
      tasks:
        - task_key: API_INGEST
          notebook_task:
            notebook_path: ../src/api_ingest.ipynb
            source: WORKSPACE
        - task_key: B_S_G
          depends_on:
            - task_key: API_INGEST
          run_if: ALL_DONE
          pipeline_task:
            pipeline_id: ${resources.pipelines.SDP_PIPELINE.id}
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED